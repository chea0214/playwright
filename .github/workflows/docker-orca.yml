name: Docker Build & Download
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile_orca -t local-orcaslicer:v2.4.2 .
      - name: Save image as artifact
        run: |
          docker save local-orcaslicer -o orcaslicer.tar
          gzip playwright.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-playwright
          path: orcaslicer.tar.gz
