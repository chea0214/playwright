name: Docker Build & Download
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile_orca -t local-orcaslicer:v2.4.2 .

      - name: Save image as artifact
        run: |
          docker save local-orcaslicer:v2.4.2 -o orcaslicer.tar
          gzip orcaslicer.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-docker-image
          path: orcaslicer.tar.gz

