name: Build Orca CLI & Export Docker Image tar.gz
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OrcaSlicer source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build OrcaSlicer CLI (No GUI, using official build_linux.sh)
        run: |
          # 注入cmake参数：关闭GUI，只编译CLI
          export ORCA_EXTRA_BUILD_ARGS="-DSLIC3R_GUI=OFF"
          # -g 容器编译，-j2限制并行，-d构建依赖，-s编译orca，-r跳过内存检查
          ./build_linux.sh -g -j2 -dsr

      - name: Build lightweight runtime docker image
        run: |
          docker build -f Dockerfile_orca -t orca-cli:v2.4.2 .

      - name: Export docker image to tar.gz
        run: |
          docker save orca-cli:v2.4.2 -o orca-cli.tar
          gzip orca-cli.tar

      - name: Upload artifact orca-cli.tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: orca-cli-docker-image
          path: orca-cli.tar.gz
